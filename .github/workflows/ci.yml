name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @one-form/web lint
      - run: pnpm --filter @one-form/web build
      - run: pnpm --filter @one-form/web test

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: apps/backend
        run: uv sync
      - working-directory: apps/backend
        run: uv run pytest -q

  contract:
    name: contract (OpenAPI→TS 드리프트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: uv sync
      # 백엔드 스키마로 타입을 재생성했을 때 커밋된 schema.ts와 달라지면 실패
      # (= 스키마를 바꾸고 `pnpm gen:api`를 안 돌린 커밋을 막는다)
      - run: pnpm gen:api
      - run: git diff --exit-code apps/web/src/shared/api/schema.ts
