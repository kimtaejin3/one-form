[project]
name = "one-form-backend"
version = "0.1.0"
description = "one-form FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.116",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2,<6.15",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.30",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
